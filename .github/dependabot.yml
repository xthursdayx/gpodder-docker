version: 2
updates:
  # Keeps the actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
# The Docker base is not tracked here: LinuxServer's Selkies base uses distro
# tags (alpine324 -> alpine325) that Dependabot can't version-compare. Bump the
# two FROM lines in the Dockerfile together when LSIO publishes a new Alpine tag.
